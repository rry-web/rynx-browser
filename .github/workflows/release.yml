name: Release

# Push a tag like v0.2.0-beta.1 to check, test and build every platform, publish a GitHub
# release, and publish the crate to crates.io. Tags with a "-" (beta, rc) are published as
# pre-releases. Run it manually to check and build without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit hashes; see ci.yml
jobs:
  # The same gates as CI, so a tag on a commit CI never checked can't be released
  checks:
    name: Formatting, lints and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Vulnerabilities, licences and sources
        run: cargo deny --locked check

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # sign build provenance attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use an older Ubuntu so they run on older glibc versions too
          # Statically linked: runs on any x86_64 Linux, including musl distributions
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, test: true }
          # Cross-compiled on Apple Silicon, so its tests can't run natively
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Diagnose the terminal tests' crash
        run: |
          sudo apt-get install -y gdb
          T=${{ matrix.target }}
          cargo test --locked --target $T --test terminal --no-run
          bin=$(ls target/$T/debug/deps/terminal-* | grep -v '\.d$')
          lscpu | grep -E "Model name|Flags" | cut -c1-400
          echo "::group::One at a time"
          "$bin" --test-threads=1 2>&1 | tail -40 || true
          echo "::endgroup::"
          for run in 1 2; do
            echo "== gdb, in parallel, run $run"
            gdb -batch -ex "set pagination off" -ex "handle SIGPIPE nostop noprint" -ex run \
              -ex bt -ex "info registers rip rsp" -ex "x/6i \$pc" -ex "info threads" -ex "thread apply all bt 25" \
              --args "$bin" 2>&1 | grep -v "^\[New Thread\|^\[Thread .* exited\|^\[Detaching\|^\[Inferior" | tail -400
          done
          exit 1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-auditable,cargo-audit
      # The program carries its exact dependency list (cargo auditable), so anyone can check a
      # downloaded copy for known vulnerabilities: cargo audit bin rynx
      - name: Build
        run: cargo auditable build --release --locked --target ${{ matrix.target }}
      - name: Check the dependency list is in the program
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/rynx
          # Named, not tested for: Git Bash's [ -f rynx ] also matches rynx.exe
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          cargo audit bin "$exe"

      - name: Package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="rynx-$version-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE.txt CHANGELOG.md "$name/"
          # The Reticulum bridge, for NomadNet pages: a Python program beside rynx
          mkdir -p "$name/reticulum-bridge"
          cp bridges/reticulum/rynx_reticulum_bridge.py bridges/reticulum/README.md "$name/reticulum-bridge/"
          # The archive for people, and the bare program for rynx's updater
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/rynx.exe" "$name/"
            cp "target/${{ matrix.target }}/release/rynx.exe" "$name.exe"
            7z a "$name.zip" "$name" > /dev/null
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
            echo "program=$name.exe" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/rynx" "$name/"
            tar czf "$name.tar.gz" "$name/"
            # The folder and the bare program can't share a name: the folder goes once archived
            rm -r "$name"
            cp "target/${{ matrix.target }}/release/rynx" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
            echo "program=$name" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.program }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.program }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # rynx's updater installs only what this signature vouches for, checked against the public
      # key built into rynx (and kept in .github/release-signing-key.pub.pem)
      - name: Sign the checksums
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/release-signing-key.pem"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          # A wrong or missing secret fails here, before anything is published. The backup key is
          # accepted too: in an emergency (the release key lost or exposed) it's put in the secret
          # for one release, which rynx trusts as well
          verified=no
          for public in ../.github/release-signing-key.pub.pem ../.github/release-signing-key-backup.pub.pem; do
            if openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig; then
              verified=yes
            fi
          done
          [ "$verified" = yes ]

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of the changelog, then how to install and verify
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-notes-footer.md >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rynx $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"

  # Trusted publishing: crates.io trusts this repository's release workflow, which gets a token
  # valid for minutes, so no long-lived crates.io token is stored anywhere. Set up once on
  # crates.io: the crate's Settings, Trusted Publishing, add rry-web/rynx-browser and release.yml.
  crate:
    name: Publish to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # prove to crates.io that this is the release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
