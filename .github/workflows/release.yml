name: Release

# Push a tag like v0.2.0-beta.1 to check, test and build every platform, publish a GitHub
# release, and publish the crate to crates.io. Tags with a "-" (beta, rc) are published as
# pre-releases. Run it manually to check and build without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit hashes; see ci.yml
jobs:
  # The same gates as CI, so a tag on a commit CI never checked can't be released
  checks:
    name: Formatting, lints and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Vulnerabilities, licences and sources
        run: cargo deny --locked check

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # sign build provenance attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds use an older Ubuntu so they run on older glibc versions too
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, test: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, test: true }
          # Statically linked: runs on any x86_64 Linux, including musl distributions
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, test: true }
          - { target: aarch64-apple-darwin, os: macos-latest, test: true }
          # Cross-compiled on Apple Silicon, so its tests can't run natively
          - { target: x86_64-apple-darwin, os: macos-latest, test: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, test: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="rynx-$version-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE.txt CHANGELOG.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/rynx.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/rynx" "$name/"
            tar czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of the changelog, then how to install and verify
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat .github/release-notes-footer.md >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "rynx $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"

  # Trusted publishing: crates.io trusts this repository's release workflow, which gets a token
  # valid for minutes, so no long-lived crates.io token is stored anywhere. Set up once on
  # crates.io: the crate's Settings, Trusted Publishing, add rry-web/rynx-browser and release.yml.
  crate:
    name: Publish to crates.io
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # prove to crates.io that this is the release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
