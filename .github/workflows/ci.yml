name: CI

on:
  push:
  pull_request:
  # New advisories are published against unchanged dependencies, so check them weekly too
  schedule:
    - cron: "0 6 * * 1"

# Least privilege: the jobs only need to read the code
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Third-party actions are pinned to commit hashes (with the version in a comment), so a moved or
# compromised tag can't change what runs here. Update them together, deliberately.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS has its own code paths (sandbox on Linux, download tagging on all three)
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked
      - name: Test (includes 100 randomised renderer cases)
        run: cargo test --locked

  linux-system:
    name: Linux with i2pd and a keychain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The package starts its own router as a service; it's stopped, so the test's router (with
      # rynx's options, on a free port) is the only one
      - name: Install i2pd and GNOME Keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y i2pd gnome-keyring dbus-x11
          sudo systemctl disable --now i2pd || true
      # ROUTER-04: the distribution's i2pd started, reporting progress and stopped by rynx
      - name: The real i2pd
        run: cargo test --locked --test i2pd -- --ignored the_real_i2pd_starts_reports_and_stops
      # SEC-11 on Linux: the cookie key kept in the Secret Service (an unlocked test keyring)
      - name: The Secret Service keychain
        run: |
          dbus-run-session -- sh -c '
            echo test | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --locked --test cookies -- --ignored the_system_keychain_keeps_the_key'

  lint:
    name: Formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      # The fuzz targets (fuzz/) use the browser's API; keep them building between nightly runs
      - name: Fuzz targets still build
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

  fuzz:
    name: Extended renderer fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fuzz 20,000 cases starting at a fresh offset each run
        run: |
          start=$(( (GITHUB_RUN_NUMBER * 20000) % 100000000 ))
          echo "Seeds $start..$((start + 19999)); reproduce a failure with FUZZ_SEED=<seed>"
          FUZZ_START=$start FUZZ_ITERATIONS=20000 cargo test --locked --release --test fuzz_render

  dependencies:
    name: Vulnerabilities, licences and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      # Known vulnerabilities (the RustSec database, as cargo audit), licences compatible with the
      # GPL, and dependencies only from crates.io: see deny.toml
      - name: cargo deny
        run: cargo deny --locked check

  msrv:
    name: Minimum Rust version (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Cargo.toml promises rust-version = 1.90; this keeps the promise
      - name: Build with Rust 1.90
        run: cargo check --locked --all-targets

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      # The table goes on the run's summary page; below 80% of lines fails, to catch a large
      # untested change (it's about 87% now)
      - name: Measure
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info
          {
            echo '## Test coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --fail-under-lines 80 > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
