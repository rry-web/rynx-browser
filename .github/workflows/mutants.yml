name: Mutation testing

# cargo-mutants changes the code in small ways (a condition flipped, a return value replaced)
# and checks a test notices each change. Changes no test notices ("missed") point at weak tests.
# Monthly, and on demand, over the modules where a missed bug costs most. It reports; it doesn't
# fail: the list of missed changes is on the run's summary page and in its artifact.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutants (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants
      - name: Mutate the security-critical modules
        continue-on-error: true
        run: |
          cargo mutants --shard ${{ matrix.shard }}/4 --timeout 300 --no-shuffle \
            --file src/dns.rs --file src/names.rs --file src/cookies.rs --file src/update.rs \
            --file src/i2pd.rs --file src/keys.rs --file src/network.rs --file src/forms.rs \
            --file src/anubis.rs --file src/sandbox.rs
      - name: Summary
        if: always()
        run: |
          {
            echo "## Missed (shard ${{ matrix.shard }})"
            echo '```'
            cat mutants.out/missed.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
