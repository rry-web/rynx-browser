[package]
name = "rynx"
version = "0.2.0-beta.5"
edition = "2024"
# let-chains (stable in 1.88 for edition 2024)
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A private, hardened terminal web browser with no JavaScript: web, Gemini, Gopher, feeds, and site tools over MCP"
repository = "https://github.com/rry-web/rynx-browser"
readme = "README.md"
keywords = ["browser", "terminal", "tui", "gemini", "gopher"]
categories = ["command-line-utilities", "network-programming"]
# What is needed to build, test and read about it; the manual test checklists and CI stay on GitHub
include = ["/src", "/assets", "/examples", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE.txt", "/Cargo.lock"]

[dependencies]
# rustls without a bundled crypto provider: network.rs supplies ring and every TLS config
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "gzip", "brotli", "deflate", "stream", "cookies"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
percent-encoding = "2.3.2"
encoding_rs = "0.8.42"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# OS certificate verification (system trust store and revocation) for clearweb TLS
rustls-platform-verifier = "0.7.1"
# Bundled root certificates for I2P, where the OS verifier would leak lookups outside the proxy
webpki-roots = "1.0.11"
scraper = "0.29.0"
ego-tree = "0.11.1"
unicode-width = "0.2.2"
arboard = "3.7.0"
futures-util = "0.3.34"
directories = "6.0.0"
# Gemini: TLS connections outside reqwest, and certificate fingerprints (both already used by rustls)
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
ring = "0.17.14"
quick-xml = "0.42.0"
serde_json = "1.0.154"
# Anubis argon2id challenges: the same version (and so the same default parameters) Anubis uses
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# Images: drawing them in the terminal (Kitty, iTerm2, Sixel, or text blocks), and decoding with
# pure-Rust decoders only. ratatui-image's chafa feature (a C library) is left out.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The page cache and snapshots: gzip (pure Rust) and HTTP dates
flate2 = "1.1.10"
httpdate = "1.0.3"

# Tagging downloads with their origin (macOS quarantine, Linux xdg origin)
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
xattr = "1.6.1"

# Filesystem sandbox
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
wiremock = "0.6.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
