[package]
name = "rynx_browser"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
url = "2.5"
percent-encoding = "2.3"
encoding_rs = "0.8"
scraper = "0.25"
ego-tree = "0.10.0"
unicode-width = "0.2"
arboard = "3.4"
futures-util = "0.3.31"
directories = "6.0"

[dev-dependencies]
wiremock = "0.6"
flate2 = "1"
