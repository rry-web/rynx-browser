[package]
name = "rynx_browser"
version = "0.2.0-beta.1"
edition = "2024"

[dependencies]
# rustls without a bundled crypto provider: network.rs supplies ring and every TLS config
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "gzip", "brotli", "deflate", "stream"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
percent-encoding = "2.3.2"
encoding_rs = "0.8.42"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# OS certificate verification (system trust store and revocation) for clearweb TLS
rustls-platform-verifier = "0.7.1"
# Bundled root certificates for I2P, where the OS verifier would leak lookups outside the proxy
webpki-roots = "1.0.11"
scraper = "0.29.0"
ego-tree = "0.11.1"
unicode-width = "0.2.2"
arboard = "3.7.0"
futures-util = "0.3.34"
directories = "6.0.0"
# Gemini: TLS connections outside reqwest, and certificate fingerprints (both already used by rustls)
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
ring = "0.17.14"
quick-xml = "0.42.0"

# Tagging downloads with their origin (macOS quarantine, Linux xdg origin)
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
xattr = "1.6.1"

# Filesystem sandbox
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
wiremock = "0.6.5"
flate2 = "1.1.10"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
