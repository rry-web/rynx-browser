# cargo deny check: known vulnerabilities, licences, duplicate or wildcard dependencies, and where
# dependencies come from. Run in CI on every push and weekly.

[advisories]
# Known vulnerabilities fail the check (cargo-deny's default); nothing is ignored
ignore = []

[licenses]
# Licences that allow distributing rynx under GPL-3.0-or-later
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate cost build time and size; worth knowing, not worth failing over
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Everything comes from crates.io
unknown-registry = "deny"
unknown-git = "deny"
