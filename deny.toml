# cargo deny check: known vulnerabilities, licences, duplicate or wildcard dependencies, and where
# dependencies come from. Run in CI on every push and weekly.

[advisories]
# Known vulnerabilities fail the check (cargo-deny's default), and so do unmaintained crates,
# with these exceptions (none is a vulnerability; each says why and when it goes)
ignore = [
    # zvariant, zbus_names and zvariant_derive: "unmaintained" because they were merged into
    # zbus 6. They come from the Linux keychain support (keyring -> secret-service -> zbus 5),
    # and go once secret-service moves to zbus 6 (Dependabot will propose it). Added 2026-10-28.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; from secret-service's zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; from secret-service's zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; from secret-service's zbus 5" },
]

[licenses]
# Licences that allow distributing rynx under GPL-3.0-or-later
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate cost build time and size; worth knowing, not worth failing over
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Everything comes from crates.io
unknown-registry = "deny"
unknown-git = "deny"
