# Coverage-guided fuzzing of everything rynx reads from the network or disk. See fuzz/README.md.
[package]
name = "rynx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rynx = { path = ".." }
reqwest = { version = "0.13", default-features = false, features = ["cookies"] }
semver = "1"
crossterm = "0.29"
url = "2"

# Its own workspace, so the browser's builds and checks don't include it
[workspace]
members = ["."]

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gemtext"
path = "fuzz_targets/gemtext.rs"
test = false
doc = false
bench = false

[[bin]]
name = "micron"
path = "fuzz_targets/micron.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gopher"
path = "fuzz_targets/gopher.rs"
test = false
doc = false
bench = false

[[bin]]
